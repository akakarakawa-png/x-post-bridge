name: Post to X

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text to post to X"
        required: true
        type: string

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Twikit
        run: pip install "twikit==2.3.1"

      - name: Post to X
        env:
          POST_TEXT: ${{ inputs.text }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_TOTP_SECRET: ${{ secrets.X_TOTP_SECRET }}
        run: python post_x.py
